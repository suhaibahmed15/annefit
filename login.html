<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#d97757">
    <title>Admin Login | Anneloes Fit Coaching</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Anton&family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --bone: #f7f6f0;
            --chalk: #181816;
            --ink: #181816;
            --surface: #ffffff;
            --steel: #6b6a63;
            --line: #e2dfd5;
            --flare: #e63712;
            --primary: #d97757;       /* Terracotta aligned */
            --primary-light: #c25e3c; /* Peach / Deep Terracotta tone */
            --max: 480px;
            --shadow-soft: 0 10px 30px rgba(24, 24, 22, .06);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: var(--bone);
            color: var(--ink);
            font-family: 'Inter', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 24px;
        }

        .login-card {
            background: var(--surface);
            border: 1px solid var(--line);
            border-radius: 24px;
            padding: 45px;
            width: 100%;
            max-width: var(--max);
            box-shadow: var(--shadow-soft);
        }

        .mono {
            font-family: 'JetBrains Mono', monospace;
        }

        .eyebrow {
            font-family: 'JetBrains Mono', monospace;
            font-size: 11.5px;
            letter-spacing: .14em;
            text-transform: uppercase;
            color: var(--primary);
            margin-bottom: 12px;
        }

        h2 {
            font-family: 'Anton', sans-serif;
            font-size: 36px;
            text-transform: uppercase;
            margin-bottom: 24px;
            color: var(--ink);
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 20px;
        }

        .form-group label {
            font-family: 'JetBrains Mono', monospace;
            font-size: 11.5px;
            text-transform: uppercase;
            letter-spacing: .08em;
            color: var(--ink);
            font-weight: 700;
        }

        .form-group input {
            background: var(--bone);
            border: 1px solid var(--line);
            border-radius: 12px;
            padding: 14px 18px;
            color: var(--ink);
            font-family: 'Inter', sans-serif;
            font-size: 15px;
            width: 100%;
        }

        .form-group input:focus {
            border-color: var(--primary);
            outline: none;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 12.5px;
            font-weight: 700;
            letter-spacing: .06em;
            text-transform: uppercase;
            padding: 14px 28px;
            border-radius: 50px;
            border: none;
            cursor: pointer;
            width: 100%;
            background: linear-gradient(135deg, var(--primary), var(--primary-light));
            color: #ffffff;
            transition: transform .2s ease, box-shadow .2s ease;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(217, 119, 87, 0.3);
        }

        .error-msg {
            background: rgba(230, 55, 18, 0.1);
            border: 1px solid var(--flare);
            color: var(--flare);
            padding: 12px;
            border-radius: 10px;
            font-size: 13px;
            margin-bottom: 20px;
            display: none;
            text-align: center;
        }

        .reset-link {
            display: block;
            text-align: center;
            margin-top: 18px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 11px;
            color: var(--steel);
            text-transform: uppercase;
            cursor: pointer;
        }

        .reset-link:hover {
            color: var(--primary);
        }
    </style>
</head>

<body>
    <div class="login-card">
        <div class="eyebrow">Restricted Access</div>
        <h2>Admin Portal</h2>

        <div class="error-msg" id="errorMsg">Invalid credentials. Please try again.</div>

        <form id="loginForm" onsubmit="handleLogin(event)">
            <div class="form-group">
                <label for="adminUser">Admin Email</label>
                <input type="email" id="adminUser" placeholder="Enter email" required>
            </div>
            <div class="form-group">
                <label for="adminPass">Password</label>
                <input type="password" id="adminPass" placeholder="Enter password" required>
            </div>
            <button type="submit" class="btn">Login to Dashboard</button>
        </form>

        <span class="reset-link" onclick="handleReset()">Forgot Password / Reset Option</span>
    </div>

    <!-- Supabase client library, then our public config -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
    <script src="auth.js"></script>
    <script>
        (async function checkExistingSession() {
            const { data: { session } } = await supabaseClient.auth.getSession();
            if (session) window.location.href = 'admin.html';
        })();

        async function handleLogin(e) {
            e.preventDefault();
            const email = document.getElementById('adminUser').value.trim();
            const pass = document.getElementById('adminPass').value.trim();
            const errorEl = document.getElementById('errorMsg');
            const btn = e.target.querySelector('.btn');

            btn.disabled = true;
            btn.textContent = 'Logging in...';

            const { error } = await supabaseClient.auth.signInWithPassword({
                email: email,
                password: pass
            });

            btn.disabled = false;
            btn.textContent = 'Login to Dashboard';

            if (error) {
                errorEl.textContent = error.message;
                errorEl.style.display = 'block';
            } else {
                errorEl.style.display = 'none';
                window.location.href = 'admin.html';
            }
        }

        async function handleReset() {
            const email = prompt('Enter the admin email to send a password reset link to:');
            if (email === null || !email.trim()) return;

            const { error } = await supabaseClient.auth.resetPasswordForEmail(email.trim(), {
                redirectTo: window.location.origin + '/resetpassword.html'
            });

            if (error) {
                alert('Could not send reset email: ' + error.message);
            } else {
                alert('If that email is registered, a password reset link has been sent.');
            }
        }
    </script>
</body>

</html>
