<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Reset Password | Anneloes Fit Coaching</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="auth.js"></script>
</head>
<body>
  <h2>Set a new password</h2>
  <form id="resetForm">
    <input type="password" id="newPass" placeholder="New password" minlength="6" required>
    <button type="submit">Update password</button>
  </form>
  <p id="msg"></p>

  <script>
    // Supabase puts the visitor into a temporary recovery session when
    // they arrive here via the emailed link, so this just needs to call
    // updateUser — no old password or master key required.
    document.getElementById('resetForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const newPass = document.getElementById('newPass').value.trim();
      const { error } = await supabaseClient.auth.updateUser({ password: newPass });
      const msg = document.getElementById('msg');
      if (error) {
        msg.textContent = 'Error: ' + error.message;
      } else {
        msg.textContent = 'Password updated. You can now log in with it.';
        setTimeout(() => window.location.href = 'login.html', 2000);
      }
    });
  </script>
</body>
</html>
